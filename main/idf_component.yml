## lastDSMRlogger - managed component dependencies
## Date: 2026-11-22 · Build: 6
##
## The parserdsmr component decodes the P1 telegrams and is pulled as the
## ESP Component Registry release mrwheel/parserdsmr (registry names are
## lowercase; add it with idf.py add-dependency "mrwheel/parserDSMR^<ver>").
## The esp-idf-wifi-provisioner is pulled from the ESP Component Registry and
## pinned to the verified release.
## The esp32_s3_piggyback board component is vendored under components/ (see README.md for its pinned commit) because it
## is not published in the registry.
## The ring_file_store component manages the meter store's three buffered ring files (hours, days and months).
## It is pulled as the ESP Component Registry release mrwheel/ring_file_store.
## The smb_server component publishes the
## meter store's LittleFS volume as a read-only guest SMB share.
## littlefs component provides the underlying filesystem for the meter store's volume.
## The espressif/mqtt component handles MQTT communication for the logger.
## The espressif/cjson component parses the dynamic tariff JSON documents
## submitted through MQTT and the API (cJSON was moved out of the ESP-IDF
## core in 6.0 and lives in the registry since).
##
## Format for local component dependencies:
##   component_name:
##     path: relative/path/to/component
##
dependencies:
  michmich/esp-idf-wifi-provisioner: ^0.4.0
  mrwheel/ring_file_store: ^0.1.3
  joltwallet/littlefs: ^1.23.1
  mrwheel/smb_server: ^0.3.0
  espressif/mqtt: ^1.1.0
  espressif/cjson: ^1.7.19
  mrwheel/parserdsmr: ^0.9.2

